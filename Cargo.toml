[package]
name = "yrs-ax"
version = "0.0.1"
edition = "2024"
authors = ["Erick Amorim <github.com/ericklima-ca>"]
description = "Axum-based WebSocket and signaling utilities for Yrs/Yjs collaborative editing"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ericklima-ca/yrs-ax"
documentation = "https://docs.rs/yrs-ax"
keywords = ["yjs", "yrs", "crdt", "axum", "webrtc", "websockets", "signaling", "collaborative-editing"]

[dependencies]
axum = { version = "0.8.7", features = ["ws"] }
bytes = "1.11.0"
futures-util = { version = "0.3.31", features = ["sink"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = { version = "0.7.17", features = ["codec"] }
tower-http = { version = "0.6.8", features = ["fs"] }
tracing = { version = "0.1.43", features = ["log"] }
yrs = { version = "0.25.0", features = ["sync"] }

[dev-dependencies]
bytes = "1.11.0"
tokio-tungstenite = "0.28.0"
